<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="description" content="AI English Learning App for Hindi Medium Students (Class 1-8)" />
  <title>AI English Guru | हिंदी माध्यम के लिए</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
</head>
<body>
  <!-- Splash / Welcome -->
  <div id="splash" class="screen active">
    <div class="splash-content">
      <div class="logo">📚</div>
      <h1>AI English Guru</h1>
      <p class="tagline">हिंदी माध्यम के बच्चों के लिए<br>स्मार्ट English सीखने वाला ऐप</p>
      <p class="class-range">कक्षा 1 से 8 तक</p>
      <button id="startBtn" class="btn primary">शुरू करें 🚀</button>
    </div>
  </div>

  <!-- Home Dashboard -->
  <div id="home" class="screen">
    <header class="top-bar">
      <div class="user-info">
        <span id="greeting">नमस्ते! 👋</span>
        <small id="selectedClass">कक्षा चुनें</small>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
    </header>

    <main class="dashboard">
      <section class="class-selector">
        <h2>अपनी कक्षा चुनें</h2>
        <div class="class-grid" id="classGrid"></div>
      </section>

      <section class="main-menu" id="mainMenu" style="display:none;">
        <h2>आज क्या सीखना है?</h2>
        <div class="menu-grid">
          <button class="menu-card" data-section="alphabet">
            <span class="icon">🔤</span>
            <span>Alphabet</span>
            <small>अक्षर सीखें</small>
          </button>
          <button class="menu-card" data-section="vocabulary">
            <span class="icon">📖</span>
            <span>Vocabulary</span>
            <small>शब्द सीखें</small>
          </button>
          <button class="menu-card" data-section="grammar">
            <span class="icon">📝</span>
            <span>Grammar</span>
            <small>व्याकरण</small>
          </button>
          <button class="menu-card" data-section="sentences">
            <span class="icon">💬</span>
            <span>Sentences</span>
            <small>वाक्य बनाएं</small>
          </button>
          <button class="menu-card" data-section="stories">
            <span class="icon">📘</span>
            <span>Stories</span>
            <small>कहानियाँ</small>
          </button>
          <button class="menu-card" data-section="quiz">
            <span class="icon">🎯</span>
            <span>Quiz</span>
            <small>परीक्षा</small>
          </button>
          <button class="menu-card" data-section="ai-tutor">
            <span class="icon">🤖</span>
            <span>AI Tutor</span>
            <small>बात करें</small>
          </button>
          <button class="menu-card" data-section="progress">
            <span class="icon">📊</span>
            <span>Progress</span>
            <small>प्रगति</small>
          </button>
        </div>
      </section>
    </main>
  </div>

  <!-- Content Screen (shared for lessons) -->
  <div id="content" class="screen">
    <header class="top-bar">
      <button id="backBtn" class="icon-btn">←</button>
      <h2 id="contentTitle">Lesson</h2>
      <button id="speakBtn" class="icon-btn" title="Speak">🔊</button>
    </header>
    <main id="contentBody" class="content-body"></main>
  </div>

  <!-- AI Tutor Chat -->
  <div id="ai-tutor" class="screen">
    <header class="top-bar">
      <button id="aiBackBtn" class="icon-btn">←</button>
      <h2>AI English Tutor 🤖</h2>
      <button id="aiSpeakToggle" class="icon-btn" title="Voice On/Off">🔊</button>
    </header>
    <div class="chat-container">
      <div id="chatMessages" class="chat-messages"></div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="हिंदी या English में लिखें..." />
        <button id="sendBtn" class="btn primary">भेजें</button>
      </div>
      <div class="quick-prompts">
        <button class="prompt-btn" data-prompt="Hello, how are you?">Hello</button>
        <button class="prompt-btn" data-prompt="Teach me the alphabet">Alphabet</button>
        <button class="prompt-btn" data-prompt="What is a noun?">Grammar</button>
        <button class="prompt-btn" data-prompt="Translate: मेरा नाम राहुल है">Translate</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h3>सेटिंग्स</h3>
      <label>
        <span>आवाज़ की गति</span>
        <input type="range" id="voiceRate" min="0.6" max="1.2" step="0.1" value="0.9" />
      </label>
      <label>
        <span>आवाज़ का प्रकार</span>
        <select id="voiceSelect"></select>
      </label>
      <label class="checkbox">
        <input type="checkbox" id="autoSpeak" checked />
        <span>ऑटो बोलें</span>
      </label>
      <button id="closeSettings" class="btn primary">बंद करें</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
